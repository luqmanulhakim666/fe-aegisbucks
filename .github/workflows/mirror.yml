name: Mirror to GitHub A

on:
  push:
    branches:
      - main # sesuaikan dengan branch Anda
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # - name: Debug token
      #   run: |
      #     curl -H "Authorization: token ${{ secrets.PLATINUM_TOKEN }}" https://api.github.com/user

      - name: Push to GitHub A
        run: |
          git remote add target https://x-access-token:${{ secrets.PLATINUM_TOKEN }}@github.com/platinum-cineplex/fe-aegisbucks.git
          git push target main --force
