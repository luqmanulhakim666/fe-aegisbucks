name: CD

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🧪 Inject .env
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build Nuxt project
        run: |
          npm run build
          npm install --omit=dev

      - name: 📦 Archive build
        run: tar -czf build.tar.gz .nuxt node_modules .env static nuxt.config.js package.json

      - name: 🚀 Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./build.tar.gz
          target: /app/fe/

      - name: 🔁 Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Make sure Node.js is in PATH
            export PATH=$PATH:/usr/bin:/usr/local/bin

            echo "📁 Entering project directory"
            cd /app/fe

            echo "🛑 Stopping existing app"
            pm2 stop fe || true

            echo "🧹 Cleaning old build files"
            rm -rf .nuxt node_modules

            echo "📦 Extracting new build"
            tar -xzf build.tar.gz

            echo "🗑️ Removing build archive"
            rm -f build.tar.gz

            echo "🚀 Restarting app with PM2"
            pm2 start node_modules/nuxt/bin/nuxt.js -i max --name fe -- start
